# Termuctive cloud sessions.
# Termuctive draws its own tabs, splits and scrollback controls, so tmux stays
# invisible: no status line and no prefix key reaching the agents running inside.

set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix

set -g status off
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#T"
set -g history-limit 50000
set -s escape-time 0
set -g focus-events on
set -s extended-keys on

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:hyperlinks:extkeys:clipboard:title:focus"
set -g update-environment "COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION LANG"
set-environment -g COLORTERM truecolor

set -g aggressive-resize on
set -g window-size latest
set -g remain-on-exit off
set -g detach-on-destroy on
set -g exit-empty on
