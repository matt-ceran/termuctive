name: Termuctive

options:
  bundleIdPrefix: com.mattceran
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    LM_SKIP_METADATA_EXTRACTION: YES
    MARKETING_VERSION: 0.1.0
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: 5.0

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.14.0

targets:
  Termuctive:
    type: application
    platform: macOS
    sources:
      - Sources/Termuctive
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Termuctive
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        PRODUCT_BUNDLE_IDENTIFIER: com.mattceran.termuctive
    scheme:
      testTargets:
        - TermuctiveTests

  TermuctiveTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TermuctiveTests
    dependencies:
      - target: Termuctive
      - package: SwiftTerm
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mattceran.termuctive.tests
