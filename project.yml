name: Termuctive

options:
  bundleIdPrefix: com.mattceran
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    LM_SKIP_METADATA_EXTRACTION: YES
    MARKETING_VERSION: 0.1.0
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Termuctive/Termuctive-Bridging-Header.h
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: 5.0

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.14.0

targets:
  TermuctiveAgentFixture:
    type: tool
    platform: macOS
    sources:
      - Tests/AgentFixture
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_NAME: codex
        SKIP_INSTALL: YES

  TermuctiveWrapperFixture:
    type: tool
    platform: macOS
    sources:
      - Tests/AgentFixture
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_NAME: node
        SKIP_INSTALL: YES

  Termuctive:
    type: application
    platform: macOS
    info:
      path: Sources/Termuctive/Info.plist
      properties:
        CFBundleDisplayName: Termuctive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Termuctive Terminal Space
            UTTypeIdentifier: com.mattceran.termuctive.terminal-space
    sources:
      - Sources/Termuctive
      - path: Resources/termuctive-learning-pdf
        buildPhase: resources
        type: folder
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mattceran.termuctive
    scheme:
      testTargets:
        - TermuctiveTests

  TermuctiveTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TermuctiveTests
    dependencies:
      - target: Termuctive
      - target: TermuctiveAgentFixture
      - target: TermuctiveWrapperFixture
      - package: SwiftTerm
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mattceran.termuctive.tests
