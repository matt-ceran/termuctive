name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    timeout-minutes: 90
    runs-on: macos-26
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and scripts
        run: |
          version=$(
            awk '$1 == "MARKETING_VERSION:" { gsub(/"/, "", $2); print $2; exit }' \
              project.yml
          )
          test "$GITHUB_REF_NAME" = "v$version"
          zsh -n Scripts/*.sh
          xcrun swift-format lint --recursive Sources Tests
          git diff --check

      - name: Test release source three times
        run: |
          xcodebuild test -quiet \
            -project Termuctive.xcodeproj \
            -scheme Termuctive \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/release-tests \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

      - name: Build notarized distribution
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          for required_value in \
            "$MACOS_CERTIFICATE_P12_BASE64" \
            "$MACOS_CERTIFICATE_PASSWORD" \
            "$APPLE_NOTARY_KEY_P8_BASE64" \
            "$APPLE_NOTARY_KEY_ID" \
            "$APPLE_NOTARY_ISSUER_ID"
          do
            test -n "$required_value"
          done

          temporary_root=$(mktemp -d "${RUNNER_TEMP}/termuctive-signing.XXXXXX")
          keychain_path="$temporary_root/release.keychain-db"
          keychain_password=$(openssl rand -hex 32)

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -rf "$temporary_root"
          }
          trap cleanup EXIT INT TERM HUP

          print -rn -- "$MACOS_CERTIFICATE_P12_BASE64" \
            | base64 --decode > "$temporary_root/certificate.p12"
          print -rn -- "$APPLE_NOTARY_KEY_P8_BASE64" \
            | base64 --decode > "$temporary_root/notary-key.p8"
          chmod 600 "$temporary_root/notary-key.p8"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$temporary_root/certificate.p12" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"

          signing_identity=$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -F '"' '/Developer ID Application:/ { print $2; exit }'
          )
          test -n "$signing_identity"

          TERMUCTIVE_CODE_SIGN_IDENTITY="$signing_identity" \
          TERMUCTIVE_NOTARY_KEY="$temporary_root/notary-key.p8" \
          TERMUCTIVE_NOTARY_KEY_ID="$APPLE_NOTARY_KEY_ID" \
          TERMUCTIVE_NOTARY_ISSUER_ID="$APPLE_NOTARY_ISSUER_ID" \
          TERMUCTIVE_RELEASE_TAG="$GITHUB_REF_NAME" \
          ./Scripts/package-release.sh

      - name: Preserve verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Termuctive-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing_is_draft=$(
              gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft
            )
            test "$existing_is_draft" = true
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --draft \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "Termuctive ${GITHUB_REF_NAME#v}" \
              --verify-tag
          fi

          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
